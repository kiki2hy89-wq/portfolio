<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이혜영 — 풀스택 비주얼 디자이너 포트폴리오</title>
<meta name="description" content="패키지 · 상세페이지 · 브랜딩 · 타입 디자인 포트폴리오">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="logo" href="index.html">이혜영<span> · Visual Designer</span></a>
    <nav class="cat-nav" id="cat-nav" aria-label="카테고리"></nav>
  </div>
</header>

<div class="shell" id="top">
  <aside class="profile">
    <div id="profile-photo"></div>
    <div data-reveal>
      <div class="profile__name" id="profile-name"></div>
      <div class="profile__role" id="profile-role"></div>
    </div>
    <div class="profile__info" id="profile-info" data-reveal></div>
    <div class="profile__cta" data-reveal>
      <a class="btn btn--primary" href="#work">작업 보기</a>
      <a class="btn" data-tel href="#">연락하기</a>
    </div>
  </aside>

  <main class="content">
    <section class="hero">
      <p class="eyebrow" data-reveal>PORTFOLIO 2026</p>
      <h1 class="hero__title" data-reveal>내가 기준이 되는,<span class="hero__word">PORTFOLIO</span></h1>
      <p class="hero__desc" data-reveal>기획과 그래픽, 화면 구현까지 직접 다루는 풀스택 비주얼 디자이너입니다.<br>패키지·웹·브랜딩 세 영역을 같은 기준으로 설계합니다.</p>
      <div class="stats" id="stats" data-reveal></div>
    </section>

    <section class="section">
      <div class="section__head" data-reveal>
        <h2 class="section__title">이력</h2>
        <span class="muted" style="font-size:13px" id="career-count"></span>
      </div>
      <div class="career" id="career"></div>
    </section>

    <section class="section" id="skills-section">
      <h2 data-reveal style="margin:0 0 20px;font-size:28px;font-weight:400">툴 · 역량</h2>
      <div class="chips" id="skills" data-reveal></div>
    </section>

    <section class="section" id="work">
      <div class="section__head" data-reveal>
        <h2 class="section__title">대표 작업</h2>
        <a href="work.html#package" style="font-size:15px">전체 보기 →</a>
      </div>
      <div class="works" id="works"></div>
    </section>

    <section class="contact" data-reveal>
      <div>
        <h2>함께할 프로젝트가 있으신가요?</h2>
        <p id="contact-line"></p>
      </div>
      <a class="btn btn--primary" data-tel href="#">연락하기</a>
    </section>

    <footer class="site-footer">
      <span>© 2026 이혜영</span>
      <span>Package · Detail Page · Branding · Type Design</span>
    </footer>
  </main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
